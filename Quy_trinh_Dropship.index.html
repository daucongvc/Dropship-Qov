    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding: 2rem; }
        .page-header { text-align: center; margin-bottom: 3rem; }
        .page-header h1 { font-size: 2.2rem; font-weight: 800; color: #0f172a; text-transform: uppercase; }
        
        .flow-container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #cbd5e1; margin-bottom: 4rem; position: relative;}
        .flow-header { text-align: center; padding: 1.5rem; background: #ffffff; border-bottom: 2px solid #e2e8f0; }
        
        .grid-layout { display: grid; grid-template-rows: 70px minmax(180px, auto) minmax(180px, auto) minmax(180px, auto) minmax(180px, auto); grid-template-columns: 240px 1fr 1fr 1fr; }
        
        .col-header { display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f1f5f9; padding: 1rem; border-bottom: 2px solid #cbd5e1; border-right: 2px dashed #cbd5e1; font-weight: 700; color: #334155;}
        .col-header:last-child { border-right: none; }
        
        .row-header { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; font-weight: 700; text-align: center; border-bottom: 2px dashed #cbd5e1; border-right: 2px dashed #cbd5e1; }
        .cell { padding: 1.5rem; position: relative; border-bottom: 2px dashed #cbd5e1; border-right: 2px dashed #cbd5e1; display: flex; flex-direction: column; gap: 1.5rem; justify-content: center; align-items: center; }
        .cell:nth-child(4n) { border-right: none; }

        .row-op { background: #ffedd5; color: #c2410c; }
        .cell-op { background: #fff7ed; }
        .node-op { border-color: #f97316; }
        .node-op .node-icon { background: #ffedd5; color: #ea580c; }

        .row-shop { background: #dbeafe; color: #1d4ed8; }
        .cell-shop { background: #eff6ff; }
        .node-shop { border-color: #3b82f6; }
        .node-shop .node-icon { background: #dbeafe; color: #2563eb; }

        .row-web { background: #f3e8ff; color: #7e22ce; }
        .cell-web { background: #faf5ff; }
        .node-web { border-color: #a855f7; }
        .node-web .node-icon { background: #f3e8ff; color: #9333ea; }

        .row-erp { background: #dcfce7; color: #15803d; border-bottom: none;}
        .cell-erp { background: #f0fdf4; border-bottom: none;}
        .node-erp { border-color: #22c55e; }
        .node-erp .node-icon { background: #dcfce7; color: #16a34a; }

        .node { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 2px solid; text-align: center; position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; width: 220px; margin: 0 auto; }
        .node-error { border-color: #ef4444 !important; }
        .node-error .node-icon { background: #fee2e2 !important; color: #dc2626 !important; }
        
        .node-icon { font-size: 1.5rem; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .node-text { font-size: 0.9rem; font-weight: 700; color: #1e293b; line-height: 1.4; }
        
        svg.connections { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        path.arrow-line { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 6,4; }
        polygon.arrow-head { fill: #94a3b8; }
    </style>
</head>

                    <div class="col-header">${f.cols[1]}</div>
                    <div class="col-header">${f.cols[2]}</div>`;
            
            actors.forEach(actor => {
                html += `<div class="row-header ${actor.rowClass}"><i class="fas ${actor.icon} mb-2 text-3xl"></i><span class="mt-2 text-sm uppercase">${actor.name}</span></div>`;
                for(let i=0; i<3; i++) {
                    html += `<div class="cell ${actor.cellClass}">`;
                    f.nodes[actor.key][i].forEach(n => {
                        let errClass = n.error ? "node-error" : "";
                        html += `<div class="node ${actor.nodeClass} ${errClass}" id="${n.id}"><div class="node-icon"><i class="fas ${n.icon}"></i></div><div class="node-text">${n.text}</div></div>`;
                    });
                    html += `</div>`;
                }
            });
            
            html += `</div>
                <svg class="connections"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/></marker></defs></svg>
            </div>`;
            container.innerHTML += html;
        });

        function drawAllLines() {
            function connect(containerId, id1, id2, type="direct") {
                const c = document.getElementById(containerId);
                if(!c) return;
                const svg = c.querySelector('svg');
                const e1 = document.getElementById(id1);
                const e2 = document.getElementById(id2);
                if (!e1 || !e2) return;

                const cr = c.getBoundingClientRect();
                const r1 = e1.getBoundingClientRect();
                const r2 = e2.getBoundingClientRect();

                const x1 = r1.left + r1.width/2 - cr.left;
                const y1 = r1.top + r1.height/2 - cr.top;
                const x2 = r2.left + r2.width/2 - cr.left;
                const y2 = r2.top + r2.height/2 - cr.top;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("class", "arrow-line");
                path.setAttribute("marker-end", "url(#arrow)");

                let d = "";
                if (type === "vertical") d = `M ${x1} ${r1.bottom - cr.top} L ${x2} ${r2.top - cr.top - 5}`;
                else if (type === "vertical-up") d = `M ${x1} ${r1.top - cr.top} L ${x2} ${r2.bottom - cr.top + 5}`;
                else if (type === "horizontal") d = `M ${r1.right - cr.left} ${y1} L ${r2.left - cr.left - 5} ${y2}`;
                else if (type === "horizontal-reverse") d = `M ${r1.left - cr.left} ${y1} L ${r2.right - cr.left + 5} ${y2}`;
                else if (type === "diagonal-down") d = `M ${x1} ${r1.bottom - cr.top} V ${(y1+y2)/2} H ${x2} V ${r2.top - cr.top - 5}`;
                else if (type === "diagonal-up") d = `M ${r1.right - cr.left} ${y1} H ${(x1+x2)/2} V ${r2.bottom - cr.top + 20} H ${x2} V ${r2.bottom - cr.top + 5}`;
                else if (type === "elbow-right-down") d = `M ${r1.right - cr.left} ${y1} H ${r1.right - cr.left + 30} V ${y2} H ${r2.left - cr.left - 5}`;
                else if (type === "elbow-left-up") d = `M ${r1.left - cr.left} ${y1} H ${r1.left - cr.left - 30} V ${y2} H ${r2.left - cr.left - 5}`;
                
                path.setAttribute("d", d);
                svg.appendChild(path);
            }

            document.querySelectorAll('.connections').forEach(svg => {
                const defs = svg.querySelector('defs');
                svg.innerHTML = '';
                if(defs) svg.appendChild(defs);
            });

            flows.forEach(f => {
                f.links.forEach(l => connect(f.id, l[0], l[1], l[2]));
            });
        }

        setTimeout(drawAllLines, 200);
        window.addEventListener('resize', drawAllLines);
    </script>
</body>
</html>
